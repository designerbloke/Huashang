<title>Campus Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 10.5 12 4l9 6.5M5.5 9.2V19h13V9.2M9.5 19v-5h5v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Campus Ops</span>
        <span class="brand-sub" data-i18n="brandSub">Operations console</span>
      </span>
    </div>

    <nav class="nav" id="nav" aria-label="Sections"></nav>

    <div class="rail-foot">
      <button class="rail-user" id="railUser" type="button">
        <span class="avatar">HL</span>
        <span class="rail-user-text">
          <span class="rail-user-name">Huang Liyun</span>
          <span class="rail-user-role" data-i18n="userRole">Group operations manager</span>
        </span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn only-narrow" id="menuBtn" type="button" aria-label="Sections">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="filter">
          <label class="filter-label" for="campusFilter" data-i18n="campusFilter">Campus / entity</label>
          <select class="select" id="campusFilter"></select>
        </div>
        <span class="proto-flag" title="All figures and records on this screen are illustrative sample data">
          <span class="dot" aria-hidden="true"></span><span data-i18n="protoFlag">Prototype - sample data</span>
        </span>
      </div>
      <div class="topbar-right">
        <button class="ghost-btn" id="assistantBtn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3.5 13.7 9l5.5 1.7-5.5 1.7L12 18l-1.7-5.6L4.8 10.7 10.3 9 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span data-i18n="askAssistant">Ask assistant</span>
        </button>
        <div class="seg" role="group" aria-label="Language">
          <button type="button" class="seg-btn is-on" data-lang="en">EN</button>
          <button type="button" class="seg-btn" data-lang="zh">中文</button>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden aria-label="Detail"></aside>

<aside class="assistant" id="assistant" hidden aria-label="Assistant">
  <header class="assistant-head">
    <div>
      <h2 class="assistant-title" data-i18n="assistantTitle">Operations assistant</h2>
      <p class="assistant-note" data-i18n="assistantNote">Simulated responses, drawn from the sample records on this screen.</p>
    </div>
    <button class="icon-btn" id="assistantClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="17" height="17"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="assistant-log" id="assistantLog"></div>
  <div class="assistant-prompts" id="assistantPrompts"></div>
  <form class="assistant-form" id="assistantForm">
    <input class="assistant-input" id="assistantInput" type="text" autocomplete="off" placeholder="Ask about approvals, follow-ups or a campus">
    <button class="primary-btn" type="submit" data-i18n="send">Send</button>
  </form>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="chart-tip" id="chartTip" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
